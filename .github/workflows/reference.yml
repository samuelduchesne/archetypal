name: Reference

# The reference tier (spec 001 research R3; spec 002 plan, Tooling configuration): the
# reference-set evidence, slow, run weekly, on demand and on every milestone tag.
on:
  schedule:
    # Sundays 03:23 UTC.
    - cron: "23 3 * * 0"
  workflow_dispatch:
  push:
    tags:
      - "v3.*"

permissions:
  contents: read

env:
  ENERGYPLUS_VERSION: 24.2.0
  ENERGYPLUS_BUILD: 94a887817b
  ENERGYPLUS_DIR: /usr/local/EnergyPlus-24-2-0

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Install EnergyPlus ${{ env.ENERGYPLUS_VERSION }}
        run: |
          archive="EnergyPlus-${ENERGYPLUS_VERSION}-${ENERGYPLUS_BUILD}-Linux-Ubuntu22.04-x86_64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/NREL/EnergyPlus/releases/download/v${ENERGYPLUS_VERSION}/${archive}"
          sudo mkdir -p "${ENERGYPLUS_DIR}"
          sudo tar -xzf "/tmp/${archive}" -C "${ENERGYPLUS_DIR}" --strip-components=1
          echo "${ENERGYPLUS_DIR}" >> "${GITHUB_PATH}"
          "${ENERGYPLUS_DIR}/energyplus" --version

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch Basilisk at the pinned commit and build the harness
        run: |
          tools/basilisk-check/fetch-basilisk.sh
          dotnet build tools/basilisk-check --nologo -v q

      - name: Run the reference tier
        # Exit status 5 means no reference test is written yet. The UMI round trips (spec 003,
        # tests/reference/test_umi_round_trip.py) save each library they write.
        run: |
          mkdir -p out/reference-libraries
          uv run pytest -m reference --write-libraries out/reference-libraries || test $? -eq 5

      - name: Check the written reference libraries with Basilisk
        # SC-002: Basilisk, UMI's own code, loads the library of each of the 49 reference
        # buildings (spec 003 T067). A building without migrated results is skipped above.
        run: |
          shopt -s nullglob
          libraries=(out/reference-libraries/*.json)
          if [ ${#libraries[@]} -eq 0 ]; then
            echo "No reference library written: nothing to check"
          else
            echo "Checking ${#libraries[@]} libraries"
            dotnet run --no-build --project tools/basilisk-check -- "${libraries[@]}"
          fi

      - name: Upload the verification output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            verification/
            out/reference-libraries/
          if-no-files-found: warn
