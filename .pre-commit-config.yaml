# cruft and spec-kit write these files themselves, so the hooks leave their formatting alone.
# The UMI sample libraries are verbatim copies whose SHA-256 is recorded in their README.
# The fixture results (SQLite) and weather file are binary or verbatim copies (tests/fixtures/SOURCES.md).
exclude: ^(\.cruft\.json|\.specify/.*|tests/fixtures/umi/(BostonTemplateLibrary_2|BostonTemplateLibrary_nodup|umi_samples_BostonTemplateLibrary)\.json|tests/fixtures/.*\.(sql|epw)|tests/fixtures/weather/.*)$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json
      - id: pretty-format-json
        exclude: ^.devcontainer/devcontainer.json
        args: [--autofix, --no-sort-keys]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.17.6"
    hooks:
      - id: ruff-check
        args: [ --exit-non-zero-on-fix ]
      - id: ruff-format

  # Spec 002 research R18: archetypal reads models only through idfkit's typed interface.
  - repo: local
    hooks:
      - id: idfkit-check
        name: idfkit check (cross-release compatibility, typed lookups)
        entry: uv run idfkit check
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
      - id: no-untyped-idfkit-access
        name: no untyped idfkit access in src/
        description: get_collection, collections, objects_by_type, get_referenced_object, schedules_dict and get_zone_surfaces return untyped objects.
        language: pygrep
        entry: '\b(get_collection|objects_by_type|get_referenced_object|schedules_dict|get_zone_surfaces)\b|\.collections\b'
        types: [python]
        files: ^src/
