[project]
name = "archetypal"
version = "0.0.1"
description = "Create, translate and codify building energy archetypes on SBEM."
authors = [{ name = "Samuel Letellier-Duchesne", email = "samuelduchesne@me.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<3.13"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "idfkit>=1.3.0rc2,<2",
    "click>=8.1,<9",
    "pydantic>=2.9,<3",
    "numpy>=1.26",
    "epinterface>=1.5.0,<1.6",
]

[project.urls]
Homepage = "https://samuelduchesne.github.io/archetypal/"
Repository = "https://github.com/samuelduchesne/archetypal"
Documentation = "https://samuelduchesne.github.io/archetypal/"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.23.0",
    "pyright>=1.1.389",
    "pytest-cov>=4.0.0",
    "ruff>=0.13.0",
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "pytest-timeout>=2.3.1",
    "hypothesis>=6.100.0",
    "pytest-markdown-docs>=0.6.0",
    "mkdocs-click>=0.8.1",
]

[tool.uv.sources]
# SBEM fork of epinterface, pinned to a pushed commit until the fork is tagged.
epinterface = { git = "https://github.com/samuelduchesne/epinterface", rev = "cc81de2cecd83271daa97cf18a0031f701225243" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archetypal"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportUnknownArgumentType = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Enables strict config, markers, xfail and parametrize ids (pytest 9+)
strict = true
markers = [
    "energyplus: needs EnergyPlus 24.2",
    "reference: reference-set evidence (slow)",
]
addopts = "-m 'not energyplus and not reference' --durations=15"
timeout = 5

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-datetimez
    "DTZ",
    # flake8-logging
    "LOG",
    # flake8-pie
    "PIE",
    # flake8-pytest-style
    "PT",
    # flake8-return
    "RET",
    # flake8-type-checking
    "TC",
    # flake8-use-pathlib
    "PTH",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
    # perflint
    "PERF",
    # refurb
    "FURB",
    # pydocstyle
    "D",
    # NumPy-specific rules
    "NPY",
    # pylint
    "PL",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

# Let TC fixes add `from __future__ import annotations` instead of quoting types
future-annotations = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "PLR2004"]

[tool.ruff.format]
preview = true

[tool.deptry.per_rule_ignores]
# Declared for specs 001-003; remove each name once the package imports it.
DEP002 = ["idfkit", "click", "pydantic", "numpy", "epinterface"]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.idfkit.check]
# Spec 002 research R18: lint idfkit use against every release from 22.1 on.
paths = ["src"]
since = "22.1"
extend-select = ["C004"]
fail-on = "warning"
