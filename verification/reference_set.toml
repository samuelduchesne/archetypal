# Reference set for spec 002 (reduce to SBEM): the buildings on which reduction is verified.
#
# 49 buildings: the 16 DOE/PNNL commercial prototypes (ANSI/ASHRAE/IES 90.1-2022 edition) in
# a hot (2A, Tampa), a mixed (4A, New York) and a cold (6A, Rochester, MN) climate zone, plus
# the DOE residential single-family prototype (2024 IECC, climate zone 4A, gas furnace, slab
# foundation). Commercial and residential models come from https://www.energycodes.gov
# (prototype building models page); weather files are the TMY3 files each prototype names,
# from the EnergyPlus weather mirror (same WMO stations, current file names).
#
# Each building is one member of a zip archive. `report.py --fetch` downloads every archive
# and weather zip into a cache folder, checks the archive's SHA-256, extracts the member and
# checks its SHA-256. Models are never committed: this file is the mechanism.
#
# Notes:
# - The energycodes.gov firewall rejects requests whose User-Agent is curl's or Python
#   urllib's default ("Request Rejected", HTTP 404). Fetch with an explicit, honest client
#   name (`user_agent` below).
# - The prototypes are published for EnergyPlus 22.1 (commercial) and 23.1 (residential),
#   not 24.x. The reference set runs on EnergyPlus 24.2 (research R3): migrate each model
#   with idfkit (`idfkit.migration.migrate`) first, which needs EnergyPlus's transition
#   programs (PreProcess/IDFVersionUpdater) for 22.1->23.1->23.2->24.1->24.2.
# - Hashes were computed on 2026-11-22 from the URLs below. If PNNL republishes an archive,
#   its hash changes and the fetch fails loudly; update the entry deliberately.

schema_version = 1
user_agent = "archetypal-verification"
